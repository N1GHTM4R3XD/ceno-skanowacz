name: Check Prices

on:
  schedule:
    # Run twice a day at 8:00 and 16:00 Polish time (UTC+2 in summer = 6:00 and 14:00 UTC)
    - cron: '0 6,14 * * *'
  workflow_dispatch: # allow manual triggering

jobs:
  check-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./scripts
        run: npx playwright install --with-deps chromium

      - name: Run price checker
        working-directory: ./scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node check-prices.js

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-debug-files
          path: scripts/debug/
          retention-days: 5

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add artifacts/price-tracker/public/data/tracker-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja cen" && git pull --rebase origin main && git push)
